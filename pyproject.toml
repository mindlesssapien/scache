[project]
name = "scache"
version = "0.1.0"
description = "Semantic Caching for LLM API's"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "locust>=2.47.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "prometheus-client>=0.26.0",
    "redis>=8.1.0",
    "sentence-transformers>=6.2.0",
    "spacy>=3.8.18",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
